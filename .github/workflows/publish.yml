name: Publish to NuGet

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: 10.x

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build and Pack
      run: .\build.cmd nuget-pack --configuration Release

    - name: Upload NuGet packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
      id: login
      with:
          user: ${{ secrets.NUGET_USER }}

    - name: NuGet push
      run: |
          $packages = Get-ChildItem -Path artifacts/*.nupkg
          if ($packages.Count -ne 1) {
            throw "Expected exactly 1 package, found $($packages.Count)"
          }
          $symbols = Get-ChildItem -Path artifacts/*.snupkg
          if ($symbols.Count -ne 1) {
            throw "Expected exactly 1 symbol package, found $($symbols.Count)"
          }
          # dotnet nuget push automatically publishes the sibling .snupkg as the symbol package.
          dotnet nuget push $packages[0].FullName --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
      shell: pwsh
