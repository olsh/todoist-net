name: Sonar

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  sonar:
    runs-on: windows-latest
    environment: sonar-pr
    permissions:
      contents: read
      actions: read
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
    - name: Download PR metadata
      uses: actions/download-artifact@v8
      with:
        name: pr-metadata
        path: pr-metadata
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Read PR metadata
      run: |
        echo "PR_NUMBER=$(Get-Content 'pr-metadata/pr_number')" >> $env:GITHUB_ENV
        echo "PR_BASE=$(Get-Content 'pr-metadata/pr_base')" >> $env:GITHUB_ENV
        echo "PR_BRANCH=$(Get-Content 'pr-metadata/pr_branch')" >> $env:GITHUB_ENV
        echo "PR_SHA=$(Get-Content 'pr-metadata/pr_sha')" >> $env:GITHUB_ENV

    # Sonar analysis has to build the contributor's code, so this job checks out
    # the PR head with SONAR_TOKEN in scope - the pattern Sonar flags as S7631.
    # The sonar-pr environment above requires maintainer approval before the job
    # starts, so fork code never runs unreviewed.
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.PR_SHA }}
        fetch-depth: 0
        allow-unsafe-pr-checkout: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache SonarQube
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar

    - name: Run Sonar Analysis
      run: |
        .\build.cmd sonar --configuration Release `
          --pr-number ${{ env.PR_NUMBER }} `
          --pr-base ${{ env.PR_BASE }} `
          --pr-branch ${{ env.PR_BRANCH }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
